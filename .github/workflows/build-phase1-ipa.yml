name: Build Wyrm Phase 2 asset foundation

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

env:
  WYRM_VERSION: "0.2.0"
  WYRM_BUILD: "13"
  WYRM_BUILD_SLUG: "original-engine-assets-verified"

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 35
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Record Apple toolchain
        run: |
          sw_vers
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          xcrun --sdk iphonesimulator --show-sdk-version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Fetch pinned SDL3 and MoltenVK
        run: bash Scripts/fetch-ios-dependencies.sh

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Verify original engine asset snapshot
        run: |
          cd Resources/EngineAssets
          shasum -a 256 -c SHA256SUMS

      - name: Compile simulator lane
        run: |
          set -o pipefail
          xcodebuild \
            -project WyrmIOS.xcodeproj \
            -scheme Wyrm \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build-simulator \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build | tee xcodebuild-simulator.log

      - name: Package browser-simulator app
        run: |
          ditto -c -k --sequesterRsrc --keepParent \
            build-simulator/Build/Products/Debug-iphonesimulator/Wyrm.app \
            Wyrm-Phase2-simulator.app.zip
          shasum -a 256 Wyrm-Phase2-simulator.app.zip | tee Wyrm-Phase2-simulator.sha256

      - name: Compile physical iPhone ARM64 lane
        run: |
          set -o pipefail
          xcodebuild \
            -project WyrmIOS.xcodeproj \
            -scheme Wyrm \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build-device \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build | tee xcodebuild-device.log

      - name: Validate device app
        run: bash Scripts/validate-phase1-app.sh build-device/Build/Products/Release-iphoneos/Wyrm.app | tee validation.log

      - name: Package unsigned IPA for AltStore
        run: |
          mkdir -p Payload
          ditto build-device/Build/Products/Release-iphoneos/Wyrm.app Payload/Wyrm.app
          /usr/bin/zip -qry Wyrm-Phase2-unsigned.ipa Payload
          shasum -a 256 Wyrm-Phase2-unsigned.ipa | tee Wyrm-Phase2-unsigned.sha256

      - name: Add build README
        run: |
          cp phase2/CURRENT-BUILD-NOTES.md README.md
          echo >> README.md
          echo "## Provenance" >> README.md
          echo "- Source commit: \`${GITHUB_SHA}\`" >> README.md
          echo "- Cloud run: \`${GITHUB_RUN_ID}\`" >> README.md
          echo "- Generated UTC: \`$(date -u +'%Y-%m-%dT%H:%M:%SZ')\`" >> README.md

      - name: Upload Phase 2 evidence
        uses: actions/upload-artifact@v4
        with:
          name: Wyrm-iOS-${{ env.WYRM_VERSION }}-build-${{ env.WYRM_BUILD }}-${{ env.WYRM_BUILD_SLUG }}-${{ github.run_id }}
          path: |
            Wyrm-Phase2-unsigned.ipa
            Wyrm-Phase2-unsigned.sha256
            Wyrm-Phase2-simulator.app.zip
            Wyrm-Phase2-simulator.sha256
            README.md
            validation.log
            xcodebuild-device.log
            xcodebuild-simulator.log
          if-no-files-found: error
          retention-days: 14
