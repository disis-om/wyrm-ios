name: Build Wyrm Phase 1 IPA

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 35
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Record Apple toolchain
        run: |
          sw_vers
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          xcrun --sdk iphonesimulator --show-sdk-version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Fetch pinned SDL3 and MoltenVK
        run: bash Scripts/fetch-ios-dependencies.sh

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Compile simulator lane
        run: |
          set -o pipefail
          xcodebuild \
            -project WyrmIOS.xcodeproj \
            -scheme Wyrm \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build-simulator \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build | tee xcodebuild-simulator.log

      - name: Package browser-simulator app
        run: |
          ditto -c -k --sequesterRsrc --keepParent \
            build-simulator/Build/Products/Debug-iphonesimulator/Wyrm.app \
            Wyrm-Phase1-simulator.app.zip
          shasum -a 256 Wyrm-Phase1-simulator.app.zip | tee Wyrm-Phase1-simulator.sha256

      - name: Launch and capture simulator proof
        continue-on-error: true
        timeout-minutes: 3
        run: |
          set -euo pipefail
          RUNTIME_ID="$(xcrun simctl list runtimes --json | python3 -c 'import json,sys; r=[x for x in json.load(sys.stdin)["runtimes"] if x.get("isAvailable") and x.get("platform")=="iOS"]; print(sorted(r,key=lambda x:tuple(map(int,x["version"].split("."))))[-1]["identifier"])')"
          DEVICE_TYPE="$(xcrun simctl list devicetypes --json | python3 -c 'import json,sys; d=[x for x in json.load(sys.stdin)["devicetypes"] if x["name"].startswith("iPhone")]; preferred=[x for x in d if x["name"]=="iPhone 16 Pro"]; print((preferred or d)[0]["identifier"])')"
          UDID="$(xcrun simctl create 'Wyrm Phase 1 CI' "$DEVICE_TYPE" "$RUNTIME_ID")"
          cleanup() {
            xcrun simctl shutdown "$UDID" >/dev/null 2>&1 || true
            xcrun simctl delete "$UDID" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl install "$UDID" build-simulator/Build/Products/Debug-iphonesimulator/Wyrm.app
          xcrun simctl launch "$UDID" com.omrajput.wyrmios | tee simulator-launch.log
          sleep 6
          xcrun simctl io "$UDID" screenshot simulator-phase1.png
          xcrun simctl spawn "$UDID" log show --style compact --last 2m --predicate 'process == "Wyrm"' > simulator-runtime.log
          grep '\[WyrmEngine\]' simulator-runtime.log
          xcrun simctl terminate "$UDID" com.omrajput.wyrmios

      - name: Compile physical iPhone ARM64 lane
        run: |
          set -o pipefail
          xcodebuild \
            -project WyrmIOS.xcodeproj \
            -scheme Wyrm \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build-device \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build | tee xcodebuild-device.log

      - name: Validate device app
        run: bash Scripts/validate-phase1-app.sh build-device/Build/Products/Release-iphoneos/Wyrm.app | tee validation.log

      - name: Package unsigned IPA for AltStore
        run: |
          mkdir -p Payload
          ditto build-device/Build/Products/Release-iphoneos/Wyrm.app Payload/Wyrm.app
          /usr/bin/zip -qry Wyrm-Phase1-unsigned.ipa Payload
          shasum -a 256 Wyrm-Phase1-unsigned.ipa | tee Wyrm-Phase1-unsigned.sha256

      - name: Upload Phase 1 evidence
        uses: actions/upload-artifact@v4
        with:
          name: Wyrm-Phase1-IPA
          path: |
            Wyrm-Phase1-unsigned.ipa
            Wyrm-Phase1-unsigned.sha256
            Wyrm-Phase1-simulator.app.zip
            Wyrm-Phase1-simulator.sha256
            validation.log
            simulator-phase1.png
            simulator-launch.log
            simulator-runtime.log
            xcodebuild-device.log
            xcodebuild-simulator.log
          if-no-files-found: error
          retention-days: 14
