name: WyrmOriginalEngine
options:
  deploymentTarget:
    iOS: "15.0"
targets:
  OriginalEngine:
    type: library.static
    platform: iOS
    sources:
      - path: build-original-source/app/src
        excludes:
          - cimgui/imgui/imgui_impl_glfw.cpp
      - path: build-original-source/thermite/src
        excludes:
          - core/tentry.c
          - platform/tassets.c
      - path: SourcesOriginal/AppleVulkan.c
      - path: SourcesOriginal/WyrmShell.c
    dependencies:
      - framework: Vendor/SDL3.xcframework
      - framework: Vendor/MoltenVK.xcframework
    settings:
      base: &engineSettings
        PRODUCT_NAME: WyrmOriginalEngine
        GCC_C_LANGUAGE_STANDARD: gnu11
        CLANG_CXX_LANGUAGE_STANDARD: c++17
        GCC_PREPROCESSOR_DEFINITIONS:
          - $(inherited)
          - WYRM_MOBILE=1
          - WYRM_IOS=1
          - CIMGUI_NO_EXPORT
          - CGLM_FORCE_DEPTH_ZERO_TO_ONE
          - APP_VERSION=\"0.12.0\"
          - SETTINGS_VERSION=\"2.8\"
        HEADER_SEARCH_PATHS:
          - $(inherited)
          - $(SRCROOT)/build-original-source/app/src
          - $(SRCROOT)/build-original-source/thermite/include
          - $(SRCROOT)/build-original-source/thermite/src
          - $(SRCROOT)/Vendor/MoltenVK/include
          - $(SRCROOT)/Vendor/SDLInclude
          - $(SRCROOT)/SourcesOriginal
        CODE_SIGNING_ALLOWED: NO
    scheme: {}
  WyrmOriginal:
    type: application
    platform: iOS
    sources:
      - path: SourcesOriginal/Main.m
      - path: SourcesShell
      - path: Resources/Assets.xcassets
      - path: Resources/manrope.ttf
      - path: SharedEngine/app/res
        type: folder
        buildPhase: resources
    dependencies:
      - target: OriginalEngine
      - framework: Vendor/SDL3.xcframework
        embed: true
      - framework: Vendor/MoltenVK.xcframework
        embed: false
      - sdk: UIKit.framework
      - sdk: Foundation.framework
      - sdk: Metal.framework
      - sdk: MetalKit.framework
      - sdk: QuartzCore.framework
      - sdk: IOSurface.framework
      - sdk: GameController.framework
      - sdk: CoreMotion.framework
      - sdk: AVFoundation.framework
      - sdk: AudioToolbox.framework
      - sdk: CoreGraphics.framework
      - sdk: CoreVideo.framework
      - sdk: Security.framework
    settings:
      base:
        <<: *engineSettings
        PRODUCT_NAME: Wyrm
        PRODUCT_BUNDLE_IDENTIFIER: com.omrajput.wyrmios
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: SourcesOriginal/Info.plist
        TARGETED_DEVICE_FAMILY: "1"
        MARKETING_VERSION: "0.12.0"
        CURRENT_PROJECT_VERSION: "37"
        SWIFT_VERSION: "5.0"
        SWIFT_OBJC_BRIDGING_HEADER: SourcesShell/WyrmShell-Bridging-Header.h
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks"
        OTHER_LDFLAGS: "$(inherited) -lc++ -ObjC -Wl,-export_dynamic"
    scheme: {}
