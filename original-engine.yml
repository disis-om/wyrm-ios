name: WyrmOriginalEngine
options:
  deploymentTarget:
    iOS: "15.0"
targets:
  OriginalEngine:
    type: library.static
    platform: iOS
    sources:
      - path: build-original-source/app/src
        excludes:
          - cimgui/imgui/imgui_impl_glfw.cpp
      - path: build-original-source/thermite/src
        excludes:
          - core/tentry.c
          - platform/tassets.c
      - path: SourcesOriginal/AppleVulkan.c
      - path: SourcesOriginal/WyrmShell.c
      - path: SourcesOriginal/AppleArrowSkins.c
      - path: SourcesOriginal/AppleWyrmLook.c
      - path: SourcesOriginal/AppleSkinMailbox.c
    dependencies:
      - framework: Vendor/SDL3.xcframework
      - framework: Vendor/MoltenVK.xcframework
    settings:
      base: &engineSettings
        PRODUCT_NAME: WyrmOriginalEngine
        GCC_C_LANGUAGE_STANDARD: gnu11
        # -O3 like the reference client (OM, 2026-10-18); no -ffast-math
        # (Eyes Back and the tag rope are checked number for number vs NTL).
        GCC_OPTIMIZATION_LEVEL: "3"
        CLANG_CXX_LANGUAGE_STANDARD: c++17
        GCC_PREPROCESSOR_DEFINITIONS:
          - $(inherited)
          - WYRM_MOBILE=1
          - WYRM_IOS=1
          - CIMGUI_NO_EXPORT
          - CGLM_FORCE_DEPTH_ZERO_TO_ONE
          - MG_ENABLE_IPV6=1
          - APP_VERSION=\"2.2.0\"
          - SETTINGS_VERSION=\"2.8\"
        HEADER_SEARCH_PATHS:
          - $(inherited)
          - $(SRCROOT)/build-original-source/app/src
          - $(SRCROOT)/build-original-source/thermite/include
          - $(SRCROOT)/build-original-source/thermite/src
          - $(SRCROOT)/Vendor/MoltenVK/include
          - $(SRCROOT)/Vendor/SDLInclude
          - $(SRCROOT)/SourcesOriginal
        CODE_SIGNING_ALLOWED: NO
    scheme: {}
  WyrmOriginal:
    type: application
    platform: iOS
    sources:
      - path: SourcesOriginal/Main.m
      - path: SourcesShell
      - path: Resources/Assets.xcassets
      - path: Resources/manrope.ttf
      - path: Resources/bodoni_moda.ttf
      - path: Resources/ArrowSkins.png
        buildPhase: resources
      - path: Resources/WyrmAccessories.png
        buildPhase: resources
      # Wyrm skins (OM, 2026-10-13): the Skin page's pictures.
      - path: Resources/WyrmSkins.webp
        buildPhase: resources
      # The Skin page's moving preview: one frame sheet per Wyrm skin (OM, 2026-10-13).
      - path: Resources/WyrmSkinsLive
        type: folder
        buildPhase: resources
      - path: Resources/privacy.txt
        buildPhase: resources
      # Prepared copy: the original res tree, with the AIR bead atlas cells.
      - path: build-original-source/app/res
        type: folder
        buildPhase: resources
      - path: Resources/AirSkin/air_colour_wheel.png
        buildPhase: resources
    dependencies:
      - target: OriginalEngine
      - framework: Vendor/SDL3.xcframework
        embed: true
      - framework: Vendor/MoltenVK.xcframework
        embed: false
      - sdk: UIKit.framework
      - sdk: Foundation.framework
      - sdk: Metal.framework
      - sdk: MetalKit.framework
      - sdk: QuartzCore.framework
      - sdk: IOSurface.framework
      - sdk: GameController.framework
      - sdk: AVFoundation.framework
      - sdk: AudioToolbox.framework
      - sdk: CoreGraphics.framework
      - sdk: CoreVideo.framework
      - sdk: Security.framework
    settings:
      base:
        <<: *engineSettings
        PRODUCT_NAME: Wyrm
        # Keep bundled PNGs byte-for-byte. Xcode's PNG compression rewrites a
        # loose PNG resource as Apple "CgBI" (BGR, premultiplied); UIKit reads
        # that, but the engine's stb_image does not, so the red arrow drew blue.
        COMPRESS_PNG_FILES: NO
        PRODUCT_BUNDLE_IDENTIFIER: com.omrajput.wyrmios
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: SourcesOriginal/Info.plist
        TARGETED_DEVICE_FAMILY: "1"
        MARKETING_VERSION: "2.2.0"
        CURRENT_PROJECT_VERSION: "134"
        SWIFT_VERSION: "5.0"
        SWIFT_OBJC_BRIDGING_HEADER: SourcesShell/WyrmShell-Bridging-Header.h
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks"
        OTHER_LDFLAGS: "$(inherited) -lc++ -ObjC -Wl,-export_dynamic"
    scheme: {}
